[package]
name = "tauri-plugin-gallery"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "把成图写入 Android 系统相册（MediaStore），存到 Pictures/Ziran"
links = "tauri-plugin-gallery"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
