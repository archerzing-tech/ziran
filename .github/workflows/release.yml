name: Release

# 推送 v* 标签即触发发布；也可在 Actions 页手动触发（仅构建，不发版）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 根目录提供 react / @tauri-apps/api；src-tauri 提供 vite 与 tauri CLI
      - name: Install frontend deps (root)
        run: npm ci

      - name: Install app deps
        run: npm ci
        working-directory: src-tauri

      - name: Build app
        run: npx tauri build --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Attach dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Ziran ${{ github.ref_name }}
          body: |
            Ziran 桌面版安装包：

            **macOS**
            - `aarch64.dmg` → Apple Silicon（M 系列芯片）
            - `x64.dmg` → Intel 芯片
            - 首次打开若被 Gatekeeper 拦截：右键 App → 打开；或执行
              `xattr -dr com.apple.quarantine /Applications/Ziran.app`

            **Windows（支持 Windows 10 及以上）**
            - `x64-setup.exe` → 64 位安装包（推荐）
            - `x64_en-US.msi` → MSI 安装包（备用）
            - 首次安装会自动下载并安装 WebView2 运行时（系统缺失时），需要联网
          files: |
            src-tauri/target/*/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 根目录提供 react / @tauri-apps/api；src-tauri 提供 vite 与 tauri CLI
      - name: Install frontend deps (root)
        run: npm ci

      - name: Install app deps
        run: npm ci
        working-directory: src-tauri

      - name: Build app
        run: npx tauri build --target x86_64-pc-windows-msvc
        working-directory: src-tauri

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Ziran ${{ github.ref_name }}
          body: |
            Ziran 桌面版安装包：

            **macOS**
            - `aarch64.dmg` → Apple Silicon（M 系列芯片）
            - `x64.dmg` → Intel 芯片
            - 首次打开若被 Gatekeeper 拦截：右键 App → 打开；或执行
              `xattr -dr com.apple.quarantine /Applications/Ziran.app`

            **Windows（支持 Windows 10 及以上）**
            - `x64-setup.exe` → 64 位安装包（推荐）
            - `x64_en-US.msi` → MSI 安装包（备用）
            - 首次安装会自动下载并安装 WebView2 运行时（系统缺失时），需要联网
          files: |
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
