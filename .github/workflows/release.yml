# 发布流水线。
#
# 推送 v* 标签即发布。发布先建一个草稿，三个平台的构建产物各自传进草稿，
# 全部成功后最后一个 job 才把草稿转正——残缺的 release 不会被人看到。
#
#   git tag v0.0.3 && git push origin v0.0.3
#
# 或在 Actions 页手动触发，指定一个已存在的标签；可只选部分平台，
# 让一次只修一边的改动不花另一边的机时。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有标签（如 v0.0.2）'
        required: true
      macos:
        description: '构建 macOS 安装包'
        type: boolean
        default: true
      windows:
        description: '构建 Windows 安装包'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_BODY: |
    Ziran 桌面版安装包：

    **macOS**
    - `aarch64.dmg` → Apple Silicon（M 系列芯片）
    - `x64.dmg` → Intel 芯片
    - 首次打开若被 Gatekeeper 拦截：右键 App → 打开；或执行
      `xattr -dr com.apple.quarantine /Applications/Ziran.app`

    **Windows（支持 Windows 10 及以上）**
    - `x64-setup.exe` → 64 位安装包（推荐）
    - `x64_en-US.msi` → MSI 安装包（备用）
    - 首次安装会自动下载并安装 WebView2 运行时（系统缺失时），需要联网

jobs:
  # 先建一个草稿 release，后面各平台的产物上传到这个已存在的 release，
  # 而不是各自创建、互相覆盖。
  create-release:
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || { echo "tag ${TAG} does not exist" >&2; exit 1; }
          # 已发布的 release 按 tag 能查到；草稿查不到，得手动翻草稿列表：
          # 重跑必须复用，而不是为同一个 tag 再建一个 release。
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null) || true
          case "${id:-}" in '' | *[!0-9]*) id='' ;; esac
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.draft == true and .tag_name == \"${TAG}\") | .id" \
              | head -n 1)
            case "${id:-}" in '' | *[!0-9]*) id='' ;; esac
          fi
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" -f name="Ziran ${TAG}" \
              -F draft=true -F generate_release_notes=true \
              -f body="${RELEASE_BODY}" --jq '.id')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-macos:
    if: github.event_name == 'push' || inputs.macos
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 镜像已被 GitHub 退役，runner 队列长期积压（v0.0.6 起排队
          # 数天不动，把整条发布卡成草稿）。Intel 包改在最新 macOS runner 上
          # 交叉编译：同一台 arm 机器分别出 x86_64 / aarch64 两个 target 的 dmg。
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 缓存按 run 轮换 key、按前缀继承上一次的树，而不是用 rust-cache——
      # 它的 key 掺了 Cargo.lock，版本号一升每次发布都全量重编。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-macos-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            cargo-macos-${{ matrix.target }}-

      # 根目录提供 react / @tauri-apps/api；src-tauri 提供 vite 与 tauri CLI
      - name: Install frontend deps (root)
        run: npm ci

      - name: Install app deps
        run: npm ci
        working-directory: src-tauri

      # 缓存按前缀继承上一棵 target 树，里面带着上个版本构建出来的
      # 安装包；不清掉，下面的 find 会把旧版本产物一起传上 release。
      - name: Remove stale bundles from restored cache
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle

      - name: Build app
        run: npx tauri build --target ${{ matrix.target }}
        working-directory: src-tauri

      # 走 release id 上传（草稿按 tag 查不到），走 uploads 域名（api 域名
      # 对同一路径回 404）。构建出零个 dmg 是失败的构建，在这里说破，
      # 而不是绿灯通过、发一个空 release。
      - name: Upload the dmgs to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.releaseId }}
        run: |
          files=$(find src-tauri/target -type f -name '*.dmg' -path '*/bundle/dmg/*')
          if [ -z "$files" ]; then
            echo "no dmg was built" >&2
            exit 1
          fi
          for f in $files; do
            name=$(basename "$f")
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq '.[] | select(.name == "'"${name}"'") | .id' \
              | while read -r asset; do
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
                done
            gh api "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              --header "Content-Type: application/x-apple-diskimage" \
              --input "$f" >/dev/null
            echo "uploaded ${name}"
          done

  build-windows:
    if: github.event_name == 'push' || inputs.windows
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cargo-windows-${{ runner.os }}-

      - name: Install frontend deps (root)
        run: npm ci

      - name: Install app deps
        run: npm ci
        working-directory: src-tauri

      # 同上：target 树来自缓存，可能带着上个版本的安装包。
      - name: Remove stale bundles from restored cache
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle

      # WiX / NSIS 从 GitHub releases 下载，偶尔连续 504（v0.2.1 卡过三次）。
      # cargo 树已在缓存里，重试只花打包几分钟，不重编依赖。
      - name: Build app
        run: |
          for i in 1 2 3; do
            if npx tauri build --target x86_64-pc-windows-msvc; then
              exit 0
            fi
            echo "build attempt $i failed; retrying in 30s (bundler downloads hit transient 5xx)" >&2
            sleep 30
          done
          echo "all 3 build attempts failed" >&2
          exit 1
        working-directory: src-tauri

      # 同 macOS：零个安装包在这里判失败。NSIS（x64-setup.exe）与
      # MSI 都传，装哪个由用户挑。
      - name: Upload the installers to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.releaseId }}
        run: |
          files=$(find src-tauri/target -type f \( -path '*/bundle/nsis/*' -name '*.exe' -o -path '*/bundle/msi/*' -name '*.msi' \))
          if [ -z "$files" ]; then
            echo "no installer was built" >&2
            exit 1
          fi
          for f in $files; do
            name=$(basename "$f")
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq '.[] | select(.name == "'"${name}"'") | .id' \
              | while read -r asset; do
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
                done
            gh api "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              --header "Content-Type: application/octet-stream" \
              --input "$f" >/dev/null
            echo "uploaded ${name}"
          done

  # 产物都落进了草稿；这一步把它转正。
  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-macos, build-windows]
    # 平台被关掉是主动跳过：skipped 不算失败，release 带着要的东西发布。
    # 但两个平台全跳过不算发布——至少要有一个平台的产物。
    if: >-
      always() &&
      needs.create-release.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.releaseId }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F make_latest="true" >/dev/null
