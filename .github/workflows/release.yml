# 发布流水线。
#
# 推送 v* 标签即发布。发布先建一个草稿，三个平台的构建产物各自传进草稿，
# 全部成功后最后一个 job 才把草稿转正——残缺的 release 不会被人看到。
#
#   git tag v0.0.3 && git push origin v0.0.3
#
# 或在 Actions 页手动触发，指定一个已存在的标签；可只选部分平台，
# 让一次只修一边的改动不花另一边的机时。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有标签（如 v0.0.2）'
        required: true
      macos:
        description: '构建 macOS 安装包'
        type: boolean
        default: true
      windows:
        description: '构建 Windows 安装包'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_BODY: |
    Ziran 桌面版安装包：

    **macOS**
    - `aarch64.dmg` → Apple Silicon（M 系列芯片）
    - `x64.dmg` → Intel 芯片
    - 首次打开若被 Gatekeeper 拦截：右键 App → 打开；或执行
      `xattr -dr com.apple.quarantine /Applications/Ziran.app`

    **Windows（支持 Windows 10 及以上）**
    - `x64-setup.exe` → 64 位安装包（推荐）
    - `x64_en-US.msi` → MSI 安装包（备用）
    - 首次安装会自动下载并安装 WebView2 运行时（系统缺失时），需要联网

jobs:
  # 先建一个草稿 release，后面各平台的产物上传到这个已存在的 release，
  # 而不是各自创建、互相覆盖。
  create-release:
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || { echo "tag ${TAG} does not exist" >&2; exit 1; }
          # 已发布的 release 按 tag 能查到；草稿查不到，得手动翻草稿列表：
          # 重跑必须复用，而不是为同一个 tag 再建一个 release。
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null) || true
          case "${id:-}" in '' | *[!0-9]*) id='' ;; esac
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.draft == true and .tag_name == \"${TAG}\") | .id" \
              | head -n 1)
            case "${id:-}" in '' | *[!0-9]*) id='' ;; esac
          fi
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" -f name="Ziran ${TAG}" \
              -F draft=true -F generate_release_notes=true \
              -f body="${RELEASE_BODY}" --jq '.id')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-macos:
    if: github.event_name == 'push' || inputs.macos
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 镜像已被 GitHub 退役，runner 队列长期积压（v0.0.6 起排队
          # 数天不动，把整条发布卡成草稿）。Intel 包改在最新 macOS runner 上
          # 交叉编译：同一台 arm 机器分别出 x86_64 / aarch64 两个 target 的 dmg。
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 缓存按 run 轮换 key、按前缀继承上一次的树，而不是用 rust-cache——
      # 它的 key 掺了 Cargo.lock，版本号一升每次发布都全量重编。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-macos-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            cargo-macos-${{ matrix.target }}-

      # 根目录提供 react / @tauri-apps/api；src-tauri 提供 vite 与 tauri CLI
      - name: Install frontend deps (root)
        run: npm ci

      - name: Install app deps
        run: npm ci
        working-directory: src-tauri

      # 缓存按前缀继承上一棵 target 树，里面带着上个版本构建出来的
      # 安装包；不清掉，下面的 find 会把旧版本产物一起传上 release。
      - name: Remove stale bundles from restored cache
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle

      - name: Build app
        run: npx tauri build --target ${{ matrix.target }}
        working-directory: src-tauri

      # 走 release id 上传（草稿按 tag 查不到），走 uploads 域名（api 域名
      # 对同一路径回 404）。构建出零个 dmg 是失败的构建，在这里说破，
      # 而不是绿灯通过、发一个空 release。
      - name: Upload the dmgs to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.releaseId }}
        run: |
          files=$(find src-tauri/target -type f -name '*.dmg' -path '*/bundle/dmg/*')
          if [ -z "$files" ]; then
            echo "no dmg was built" >&2
            exit 1
          fi
          for f in $files; do
            name=$(basename "$f")
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq '.[] | select(.name == "'"${name}"'") | .id' \
              | while read -r asset; do
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
                done
            gh api "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              --header "Content-Type: application/x-apple-diskimage" \
              --input "$f" >/dev/null
            echo "uploaded ${name}"
          done

  build-windows:
    if: github.event_name == 'push' || inputs.windows
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cargo-windows-${{ runner.os }}-

      - name: Install frontend deps (root)
        run: npm ci

      - name: Install app deps
        run: npm ci
        working-directory: src-tauri

      # 同上：target 树来自缓存，可能带着上个版本的安装包。
      - name: Remove stale bundles from restored cache
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle

      # WiX / NSIS / 插件 dll 都是 GitHub release 资产，CDN 抽风时 bundler
      # 自带的单次下载连吃 504（v0.2.1 卡了五趟构建）。这里用长退避 curl
      # 把三个工件预下载进 bundler 的工具目录（%LOCALAPPDATA%\tauri）并
      # 校验哈希——目录齐了 bundler 就不再自己下载；目录整体进 actions/
      # cache，成功一次之后所有发布都不再碰这个 CDN。哈希取自
      # tauri-bundler 2.12.4 源码（WIX_SHA256 / NSIS_SHA1 /
      # NSIS_TAURI_UTILS_SHA1），装错文件会在这一步当场炸而不是进构建。
      # NSIS 另备 SourceForge 官方源（实测与 tauri 转存字节一致，SHA1 同为
      # DB14F8AF…），专治 GitHub CDN 对单个对象的持续性 504。
      - name: Cache vendored WiX/NSIS
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-tools-wix314-nsis313

      - name: Vendor WiX/NSIS for the bundler
        run: |
          tools="$LOCALAPPDATA/tauri"
          fetch() { # fetch <out> <url...>：逐源逐轮退避重试
            local out="$1"; shift
            for i in 1 2 3 4 5 6; do
              for u in "$@"; do
                curl -fL --connect-timeout 20 --max-time 600 -o "$out" "$u" && return 0
                echo "attempt $i failed ($u); trying next source in 30s" >&2
                sleep 30
              done
            done
            echo "gave up downloading: $*" >&2
            return 1
          }
          if [ ! -f "$tools/WixTools314/candle.exe" ]; then
            mkdir -p "$tools/WixTools314"
            fetch "$tools/wix.zip" "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
            echo "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31  $tools/wix.zip" | sha256sum -c -
            ( command -v 7z >/dev/null 2>&1 && 7z x -y -o"$tools/WixTools314" "$tools/wix.zip" >/dev/null ) \
              || ( command -v unzip >/dev/null 2>&1 && unzip -q -o "$tools/wix.zip" -d "$tools/WixTools314" )
            rm -f "$tools/wix.zip"
          fi
          if [ ! -f "$tools/NSIS/makensis.exe" ]; then
            fetch "$tools/nsis.zip" \
              "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip" \
              "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip"
            echo "DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E  $tools/nsis.zip" | sha1sum -c -
            ( command -v 7z >/dev/null 2>&1 && 7z x -y -o"$tools" "$tools/nsis.zip" >/dev/null ) \
              || ( command -v unzip >/dev/null 2>&1 && unzip -q -o "$tools/nsis.zip" -d "$tools" )
            rm -rf "$tools/NSIS"
            mv "$tools/nsis-3.13" "$tools/NSIS"
            rm -f "$tools/nsis.zip"
          fi
          dll="$tools/NSIS/Plugins/x86-unicode/additional/nsis_tauri_utils.dll"
          if [ ! -f "$dll" ]; then
            mkdir -p "$(dirname "$dll")"
            fetch "$dll" "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll"
          fi
          echo "75197FEE3C6A814FE035788D1C34EAD39349B860  $dll" | sha1sum -c -
          for f in candle.exe light.exe WixUIExtension.dll WixUtilExtension.dll; do
            [ -f "$tools/WixTools314/$f" ] || { echo "missing $tools/WixTools314/$f" >&2; exit 1; }
          done
          for f in makensis.exe Bin/makensis.exe Plugins/x86-unicode/additional/nsis_tauri_utils.dll; do
            [ -f "$tools/NSIS/$f" ] || { echo "missing $tools/NSIS/$f" >&2; exit 1; }
          done
          echo "vendored bundler tools ready in $tools"

      # WiX / NSIS 从 GitHub releases 下载，偶尔连续 504（v0.2.1 卡过三次）。
      # cargo 树已在缓存里，重试只花打包几分钟，不重编依赖。
      - name: Build app
        run: |
          for i in 1 2 3; do
            if npx tauri build --target x86_64-pc-windows-msvc; then
              exit 0
            fi
            echo "build attempt $i failed; retrying in 30s (bundler downloads hit transient 5xx)" >&2
            sleep 30
          done
          echo "all 3 build attempts failed" >&2
          exit 1
        working-directory: src-tauri

      # 同 macOS：零个安装包在这里判失败。NSIS（x64-setup.exe）与
      # MSI 都传，装哪个由用户挑。
      - name: Upload the installers to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.releaseId }}
        run: |
          files=$(find src-tauri/target -type f \( -path '*/bundle/nsis/*' -name '*.exe' -o -path '*/bundle/msi/*' -name '*.msi' \))
          if [ -z "$files" ]; then
            echo "no installer was built" >&2
            exit 1
          fi
          for f in $files; do
            name=$(basename "$f")
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq '.[] | select(.name == "'"${name}"'") | .id' \
              | while read -r asset; do
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
                done
            gh api "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              --header "Content-Type: application/octet-stream" \
              --input "$f" >/dev/null
            echo "uploaded ${name}"
          done

  # 产物都落进了草稿；这一步把它转正。
  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-macos, build-windows]
    # 平台被关掉是主动跳过：skipped 不算失败，release 带着要的东西发布。
    # 但两个平台全跳过不算发布——至少要有一个平台的产物。
    if: >-
      always() &&
      needs.create-release.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.releaseId }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F make_latest="true" >/dev/null
